[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqa-eval"
version = "0.1.0"
description = "Speech Quality Assessment evaluation library using Uni-VERSA-Ext"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "urgent2026_sqa @ git+https://github.com/urgent-challenge/urgent2026_challenge_track2",
    "torch",
    "torchaudio",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
